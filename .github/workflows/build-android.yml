name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build EchoGuide APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # 1. Install root dependencies and generate OpenAPI schema / types
      - name: Install root dependencies & build OpenAPI contract
        run: |
          npm ci
          npm run build --workspace=@echoguide/openapi

      # 2. Install mobile dependencies
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      # 3. Ensure gradlew is executable
      - name: Make gradlew executable
        run: chmod +x apps/mobile/android/gradlew

      # 4. Build Release APK (auto-downloads Vosk model & bundles JS)
      - name: Build Android Release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      # 5. Upload APK as downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoGuide-APK
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
